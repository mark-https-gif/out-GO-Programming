[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "out-lang"
version = "0.6.0"
description = "OUT: a small, fast programming language written in Go"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Go",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Interpreters",
    "Topic :: Software Development :: Compilers",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
out = "out_lang_cli:main"

[tool.setuptools]
py-modules = ["out_lang_cli"]
